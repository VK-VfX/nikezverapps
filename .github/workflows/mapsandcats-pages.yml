name: Maps and Cats - deploy web
on:
  push:
    branches: [main]
    paths: ["mapsandcats/**", ".github/workflows/mapsandcats-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site (web files only)
        run: |
          mkdir _site
          cd mapsandcats
          cp -r index.html app.css app.js sw.js manifest.webmanifest version.json favicon-*.png icon-*.png assets vendor ../_site/
          cd ..
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
