name: Maps and Cats - build APK
# Builds a debug-signed, sideloadable APK. On a push to the default branch it also publishes a GitHub Release with the APK attached.
on:
  push:
    branches: [main]
    paths: ["mapsandcats/**", ".github/workflows/mapsandcats-apk.yml"]
  pull_request:
    paths: ["mapsandcats/**", ".github/workflows/mapsandcats-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK
        working-directory: mapsandcats/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Name the APK
        id: v
        run: |
          VER=$(python3 -c "import json;print(json.load(open('mapsandcats/version.json'))['version'])")
          cp mapsandcats/android/app/build/outputs/apk/debug/app-debug.apk "MapsAndCats-v${VER}.apk"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: MapsAndCats-debug-apk
          path: MapsAndCats-v${{ steps.v.outputs.version }}.apk
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mapsandcats-v${{ steps.v.outputs.version }}
          name: Maps and Cats v${{ steps.v.outputs.version }}
          files: MapsAndCats-v${{ steps.v.outputs.version }}.apk
          generate_release_notes: true
