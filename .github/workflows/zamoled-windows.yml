name: Zamoled - build Windows app

# The Windows app is released on its own, separately from the Android app: its version is in zamoled/tools/desktop/VERSION and
# its releases are tagged zamoled-windows-v<version>. Updating the phone app never makes a Windows release. A change to the
# wallpaper generators (shared with the phone app) only re-runs the draw tests here. The zip is built and published only when
# VERSION names a release that does not exist yet, so a shipped file is never replaced.
on:
  push:
    branches: ['main']
    paths:
      - 'zamoled/tools/desktop/**'
      - 'zamoled/app/src/main/java/com/nikopick/zamoled/gen/**'
      - '.github/workflows/zamoled-windows.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: zamoled

permissions:
  contents: write

concurrency:
  group: zamoled-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the Android framework jar
        shell: bash
        run: |
          mkdir -p tools/desktop/deps
          J=android-all-instrumented-15-robolectric-13954326-i7.jar
          curl -fL --retry 5 --retry-delay 5 -o "tools/desktop/deps/$J" \
            "https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7/$J"

      # Drawn on Windows itself, so a renderer that does not work there stops the release.
      - name: Draw test pictures on Windows
        shell: bash
        working-directory: zamoled/tools/desktop
        run: bash ./gradlew test --console=plain --stacktrace

      - name: Is there a new Windows version to release?
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < tools/desktop/VERSION)"
          TAG="zamoled-windows-v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already exists; only the draw tests ran. Raise tools/desktop/VERSION to release a new Windows version."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Windows app
        if: steps.decide.outputs.publish == 'true'
        shell: bash
        working-directory: zamoled/tools/desktop
        run: bash ./gradlew distZip --console=plain --stacktrace

      - name: Keep the test pictures
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-pictures
          retention-days: 7
          path: zamoled/tools/desktop/build/smoke/*.png

      - name: Publish the Windows release
        if: steps.decide.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.decide.outputs.tag }}"
          V="${{ steps.decide.outputs.version }}"
          ZIP=tools/desktop/build/release/Zamoled-Windows-x64.zip
          SHA="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          cat > windows-notes.md <<NOTES
          Zamoled for Windows $V. The same wallpaper generators as the phone app, drawn at the shape and size of your monitor.

          **Install:** download \`Zamoled-Windows-x64.zip\`, unzip it anywhere and run \`Zamoled.exe\`. The first start takes about 15 seconds while the renderer wakes up. It is about 500 MB because it carries Android's graphics engine, so every picture matches the phone exactly. Windows may say it does not recognise the app: choose More info, then Run anyway.

          The Windows app is released on its own schedule, separately from the Android app.

          ## Check your download
          - ZIP SHA-256: \`$SHA\`
          NOTES
          gh release create "$TAG" "$ZIP" --title "Zamoled for Windows $V" --notes-file windows-notes.md --target "$GITHUB_SHA" --latest=false
