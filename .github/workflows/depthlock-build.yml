name: DepthLock - build APK

on:
  push:
    branches: ['**']
    paths:
      - 'depthlock/**'
      - '.github/workflows/depthlock-build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: depthlock

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            depthlock/**/*.gradle*
            depthlock/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DepthLock-debug
          path: depthlock/app/build/outputs/apk/debug/*.apk
